<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — Only Antifans</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #0a0a0a; color: #f5f2ee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.05em; margin-bottom: 2.5rem; text-align: center; }
    .logo span { color: #e63329; }
    .card { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2rem; width: 100%; max-width: 360px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-bottom: 1.75rem; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
    .tab { padding: 10px; text-align: center; font-size: 13px; cursor: pointer; color: rgba(255,255,255,0.35); background: #1a1a1a; transition: all 0.15s; }
    .tab.active { background: #e63329; color: white; font-weight: 500; }
    label { font-size: 12px; color: rgba(255,255,255,0.35); display: block; margin-bottom: 5px; }
    input { width: 100%; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: #f5f2ee; padding: 10px 12px; border-radius: 7px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none; margin-bottom: 14px; }
    input:focus { border-color: rgba(255,255,255,0.25); }
    input::placeholder { color: rgba(255,255,255,0.15); }
    .role-select { margin-bottom: 1.25rem; }
    .role-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 8px; }
    .role-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-btn { border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; padding: 10px; cursor: pointer; background: #1a1a1a; text-align: center; transition: border-color 0.15s; }
    .role-btn:hover { border-color: rgba(255,255,255,0.25); }
    .role-btn.selected { border-color: #e63329; background: rgba(230,51,41,0.08); }
    .role-btn-name { font-size: 13px; font-weight: 500; color: #f5f2ee; margin-bottom: 2px; }
    .role-btn-desc { font-size: 11px; color: rgba(255,255,255,0.3); }
    .btn { width: 100%; background: #e63329; color: white; border: none; padding: 12px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; margin-top: 4px; }
    .btn:hover { background: #b52820; }
    .btn:disabled { background: rgba(230,51,41,0.4); cursor: not-allowed; }
    .msg { font-size: 13px; text-align: center; margin-top: 1rem; min-height: 20px; }
    .msg.error { color: #e63329; }
    .msg.success { color: #5DCAA5; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 1.25rem 0; }
    .back-link { font-size: 12px; color: rgba(255,255,255,0.25); text-align: center; margin-top: 1.5rem; }
    .back-link a { color: rgba(255,255,255,0.4); text-decoration: none; }
    .back-link a:hover { color: #f5f2ee; }
  </style>
</head>
<body>
  <div class="logo">ONLY<span>ANTI</span>FANS</div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">로그인</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">회원가입</div>
    </div>

    <div id="form-login">
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="example@email.com">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호 입력">
      <button class="btn" onclick="login()">로그인</button>
    </div>

    <div id="form-signup" style="display:none;">
      <label>이메일</label>
      <input type="email" id="signup-email" placeholder="example@email.com">
      <label>비밀번호</label>
      <input type="password" id="signup-pw" placeholder="8자 이상">
      <label>닉네임</label>
      <input type="text" id="signup-nick" placeholder="표시될 이름">
      <div class="role-select">
        <div class="role-label">가입 유형</div>
        <div class="role-buttons">
          <div class="role-btn selected" id="role-creator" onclick="selectRole('creator')">
            <div class="role-btn-name">크리에이터</div>
            <div class="role-btn-desc">댓글 받고 수익 창출</div>
          </div>
          <div class="role-btn" id="role-antifan" onclick="selectRole('antifan')">
            <div class="role-btn-name">안티팬</div>
            <div class="role-btn-desc">익명으로 댓글 작성</div>
          </div>
        </div>
      </div>
      <button class="btn" onclick="signup()">가입하기</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
  <div class="back-link"><a href="index.html">← 홈으로 돌아가기</a></div>

  <script>
    const SUPABASE_URL = 'https://tufkylhhwhihnhckbunu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1Zmt5bGhod2hpaG5oY2tidW51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1OTgyMDgsImV4cCI6MjA5NTE3NDIwOH0.VVWpg-5qeQ-co6WIBBw6lUFG6XlkG2Wm4jLLbqQ_zwY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRole = 'creator';

    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('msg').textContent = '';
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('role-creator').classList.toggle('selected', role === 'creator');
      document.getElementById('role-antifan').classList.toggle('selected', role === 'antifan');
    }

    function setMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const pw = document.getElementById('login-pw').value;
      if (!email || !pw) return setMsg('이메일과 비밀번호를 입력해주세요.', 'error');
      setMsg('로그인 중...', '');
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
      if (error) return setMsg('로그인 실패: ' + error.message, 'error');
      const role = data.user.user_metadata?.role || 'antifan';
      setMsg('로그인 성공! 이동 중...', 'success');
      setTimeout(() => {
        window.location.href = role === 'creator' ? 'creator.html' : 'antifan.html';
      }, 800);
    }

    async function signup() {
      const email = document.getElementById('signup-email').value.trim();
      const pw = document.getElementById('signup-pw').value;
      const nick = document.getElementById('signup-nick').value.trim();
      if (!email || !pw || !nick) return setMsg('모든 항목을 입력해주세요.', 'error');
      if (pw.length < 8) return setMsg('비밀번호는 8자 이상이어야 합니다.', 'error');
      setMsg('가입 중...', '');
      const { data, error } = await supabase.auth.signUp({
        email, password: pw,
        options: { data: { nickname: nick, role: selectedRole } }
      });
      if (error) return setMsg('가입 실패: ' + error.message, 'error');
      setMsg('가입 완료! 로그인 중...', 'success');
      setTimeout(() => {
        window.location.href = selectedRole === 'creator' ? 'creator.html' : 'antifan.html';
      }, 1000);
    }
  </script>
</body>
</html>
